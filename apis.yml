name: SmartHop
description: SmartHop is a fleet and trip management platform for small trucking companies, owner-operators,
  and independent dispatchers. It aggregates real-time loads from multiple freight sources into a single
  load board and provides load booking, trip creation and management, dispatch management, payroll, profit
  optimization, market analysis, and performance reporting. SmartHop consumes third-party freight APIs from
  partners including DAT Freight & Analytics, C.H. Robinson, Loadsmart, Redwood Logistics, Newtrul, and Parade,
  but does not publish a public developer API of its own; its api.smarthop.co host backs the SmartHop web and
  mobile apps rather than a documented external API.
